name: Deploy Pages (Cloudflare)

on:
  # Manual only for now, same as the sync workflows' first runs -- once a
  # deploy has been confirmed working from the Actions log, this can move
  # to running on every push to main that touches web/.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Fill in the real D1 database id
        working-directory: web
        run: sed -i "s/REPLACE_WITH_CF_D1_DATABASE_ID/${{ secrets.CF_D1_DATABASE_ID }}/" wrangler.toml

      - name: Create the Pages project if it doesn't exist yet
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # wrangler pages deploy (unlike wrangler deploy for Workers) refuses
        # to create a missing project itself -- it wants this run first. Safe
        # to repeat: fails harmlessly with "already exists" on later runs.
        run: npx wrangler pages project create morning-hockey --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=morning-hockey --branch=main
