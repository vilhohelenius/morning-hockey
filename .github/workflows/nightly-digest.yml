name: Nightly NHL digest

on:
  schedule:
    # 06:00 UTC ≈ 08:00–09:00 Europe/Helsinki depending on daylight saving.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install .

      - name: Build digest and site
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          python -m morning_hockey.main \
            --pages-base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"

      - name: Commit updated archive data
        run: |
          git config user.name "morning-hockey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Add digest for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new digest data to commit."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
