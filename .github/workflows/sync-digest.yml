name: Sync digest to D1

on:
  # No native `schedule:` trigger -- see sync-fast-tier.yml's comment.
  # Cloudflare Worker (cron-trigger/) calls workflow_dispatch once daily
  # instead.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install ".[xg]"

      - name: Sync digest to D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_digest

      # Own step so an xG failure doesn't hide the digest's result (and the
      # other way around). Scores the finished games that have no xG rows yet.
      - name: Sync xG/GSAx to D1
        if: ${{ !cancelled() }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_xg

      # Own step: the simulation (about a minute) must not hide the xG result.
      - name: Simulate season (playoff odds)
        if: ${{ !cancelled() }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_season_sim
