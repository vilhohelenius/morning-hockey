name: Sync digest to D1

on:
  # No native `schedule:` trigger -- see sync-fast-tier.yml's comment.
  # Cloudflare Worker (cron-trigger/) calls workflow_dispatch once daily
  # instead.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install .

      - name: Sync digest to D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_digest
