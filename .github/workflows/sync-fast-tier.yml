name: Sync fast-tier schedule to D1

on:
  schedule:
    # Every 30 minutes. This is the "fast tier" of the Cloudflare migration:
    # cheap, scoreboard/schedule-only, separate from the much heavier nightly
    # digest build.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install .

      - name: Sync schedule to D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_fast_tier
