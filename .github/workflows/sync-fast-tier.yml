name: Sync fast-tier schedule to D1

on:
  # No native `schedule:` trigger -- GitHub Actions' own cron is best-effort
  # and was observed running hours late under load. A Cloudflare Worker
  # (cron-trigger/) with its own Cron Trigger calls workflow_dispatch below
  # every 30 minutes instead; see cron-trigger/src/index.ts.
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to backfill that week from (leave blank for the current week)"
        required: false
        default: ""
      weeks:
        description: "How many consecutive weeks to sync from --date (for a full-season backfill)"
        required: false
        default: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install .

      - name: Sync schedule to D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_fast_tier ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ inputs.weeks && inputs.weeks != '1' && format('--weeks {0}', inputs.weeks) || '' }}
