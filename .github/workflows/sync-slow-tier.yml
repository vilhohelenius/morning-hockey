name: Sync slow-tier stats to D1

on:
  schedule:
    # Hourly. Was every 4 hours; tightened 2026-10-01 so Pistepörssi/
    # Maalivahtipörssi feel current without a full re-fetch of every page
    # view -- triggering this (several minutes, ~32 teams' worth of NHL
    # API calls) on every visit doesn't scale and risks overlapping runs;
    # an hourly cron is the standard, safe way to get "current enough"
    # instead.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install .

      - name: Sync season stats to D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m morning_hockey.sync_slow_tier
