name = "morning-hockey-cron-trigger"
main = "src/index.ts"
compatibility_date = "2026-10-02"

[triggers]
# Fast-tier every 10 min, slow-tier every 2h, digest every 6h. Must
# stay in sync with WORKFLOW_BY_CRON in src/index.ts -- see the comment there.
crons = ["*/10 * * * *", "0 */2 * * *", "0 */6 * * *"]

[vars]
GITHUB_REPO = "vilhohelenius/morning-hockey"

# GITHUB_TOKEN is a secret, not set here -- run:
#   npx wrangler secret put GITHUB_TOKEN
# with a fine-grained GitHub PAT scoped to this repo only, Actions:
# read+write permission, nothing else.
