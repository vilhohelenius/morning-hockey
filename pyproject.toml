[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-hockey"
version = "0.1.0"
description = "NHL results, Finnish scorers/goalies and season stats, synced to Cloudflare D1 and served by a Cloudflare Pages app (web/)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# xG/GSAx sync (sync_xg.py). Only the digest workflow and the tests need these.
xg = [
    "xgboost>=3.4,<4",  # model JSON loading across major versions isn't guaranteed
    "pandas>=2.2",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"morning_hockey.xg" = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
