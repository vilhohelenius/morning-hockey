name = "morning-hockey"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "morning_hockey_db"
# Real database_id intentionally not committed (same reasoning as this repo's
# CF_D1_DATABASE_ID GitHub secret -- see d1_sync.py). Fill this in from the
# Cloudflare dashboard (Workers & Pages -> D1 -> morning_hockey_db) before
# the first real deploy; `wrangler pages dev` / `d1 execute --local` don't
# need a real value, since local mode never calls the Cloudflare API.
database_id = "REPLACE_WITH_CF_D1_DATABASE_ID"
